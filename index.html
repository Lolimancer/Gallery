<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Wuwa Gallery</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<style>
  html, body { margin:0; padding:0; overflow:hidden; height:100%; background:#0a0908; font-family: 'Georgia', 'Times New Roman', serif; }
  canvas { display:block; touch-action:none; -webkit-user-select:none; user-select:none; }
  body { -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; overscroll-behavior:none; }

  /* ---- touch controls ---- */
  #joystick {
    position:fixed; left:max(24px, env(safe-area-inset-left)); bottom:max(28px, env(safe-area-inset-bottom));
    width:130px; height:130px; border-radius:50%; z-index:7; display:none;
    background:rgba(15,12,10,0.35); border:1px solid rgba(230,210,170,0.35);
    touch-action:none;
  }
  #joystick .knob {
    position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
    border-radius:50%; background:rgba(243,236,221,0.55); border:1px solid rgba(230,210,170,0.7);
    pointer-events:none;
  }
  body.touch.playing:not(.zoomed) #joystick { display:block; }
  body.touch #crosshair { display:none; }
  body.touch #hint { bottom:180px; }
  body.touch #caption { bottom:max(24px, env(safe-area-inset-bottom)); max-width:86vw; padding:10px 18px; }
  body.touch #caption .t { font-size:17px; }
  body.touch #caption .s { font-size:12px; }
  body.touch #overlay h1 { font-size:26px; }
  body.touch #overlay p { padding:0 24px; font-size:14px; }
  .desktop-only { display:inline; } .touch-only { display:none; }
  body.touch .desktop-only { display:none; } body.touch .touch-only { display:inline; }

  #crosshair {
    position:fixed; top:50%; left:50%; width:6px; height:6px;
    margin:-3px 0 0 -3px; border-radius:50%;
    background:rgba(255,255,255,0.85); pointer-events:none; z-index:5;
    box-shadow:0 0 3px rgba(0,0,0,0.8);
  }

  #hint {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%);
    color:#e9e2d3; font-size:14px; letter-spacing:0.02em;
    background:rgba(15,12,10,0.55); padding:8px 16px; border-radius:20px;
    pointer-events:none; z-index:5; opacity:0; transition:opacity .25s ease;
  }
  #hint.show { opacity:1; }

  #caption {
    position:fixed; left:50%; bottom:60px; transform:translateX(-50%);
    text-align:center; color:#f3ecdd; z-index:6; pointer-events:none;
    opacity:0; transition:opacity .35s ease;
    background:rgba(10,9,8,0.6); padding:14px 26px; border-radius:6px;
    border:1px solid rgba(230,210,170,0.25);
    max-width:70vw;
  }
  #caption.show { opacity:1; }
  #caption .t { font-size:20px; letter-spacing:0.03em; margin-bottom:4px; }
  #caption .s { font-size:13px; color:#c9bfa8; font-style:italic; }

  #overlay {
    position:fixed; inset:0; background:radial-gradient(circle at 50% 40%, #241d16, #0a0908 75%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    z-index:20; color:#f3ecdd; text-align:center; cursor:pointer;
  }
  #overlay h1 { font-weight:400; letter-spacing:0.12em; font-size:34px; margin:0 0 10px; }
  #overlay p { color:#c9bfa8; font-size:15px; max-width:480px; line-height:1.6; margin:6px 0; }
  #overlay .enter {
    margin-top:22px; padding:12px 34px; border:1px solid rgba(230,210,170,0.5);
    border-radius:2px; letter-spacing:0.08em; font-size:14px;
  }
  #overlay.hidden { display:none; }

  #loading {
    position:fixed; inset:0; background:#0a0908; z-index:30;
    display:flex; align-items:center; justify-content:center; color:#c9bfa8;
    font-size:14px; letter-spacing:0.1em;
  }
</style>
</head>
<body>

<div id="loading">XUAN LOADING…</div>

<div id="overlay" class="hidden">
  <h1>WUWA GALLERY</h1>
  <p class="desktop-only">Click on the pic for a closer look - click again (or press Esc) to step back.</p>
  <p class="touch-only">Tap a picture frame for a closer look - tap again to step back.</p>
  <div class="enter"><span class="desktop-only">CLICK TO ENTER</span><span class="touch-only">TAP TO ENTER</span></div>
</div>

<div id="crosshair"></div>
<div id="hint"><span class="desktop-only">Click to view</span><span class="touch-only">Tap a frame to view</span></div>
<div id="joystick"><div class="knob"></div></div>
<div id="caption"><div class="t"></div><div class="s"></div></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* ---------------------------------------------------------------------
   CONFIG — swap artwork by dropping any image files into ./images/.
   No particular filenames are required: the folder is listed at load
   time (your dev server needs to show a directory listing for this —
   VS Code "Live Server" does this automatically) and every image file
   found is used, cycling if there are more frames than images. Each
   frame's title is its image's filename, minus the extension. Every
   frame is sized to its own image's aspect ratio (landscape, portrait,
   square, ultra-wide - anything), so pictures are never cropped or
   stretched.
--------------------------------------------------------------------- */
async function discoverImages() {
  const exts = ['.jpg', '.jpeg', '.png', '.webp', '.gif', '.bmp'];

  try {
    // GitHub Pages does not provide directory listings, so ask the
    // GitHub repository API for the contents of the images/ folder.
    const apiUrl = 'https://api.github.com/repos/lolimancer/Gallery/contents/images';

    const res = await fetch(apiUrl, { cache: 'no-store' });
    console.log('%cGitHub images API', 'color:#8ab4f8', 'status', res.status, res.url);

    if (!res.ok) {
      throw new Error('GitHub API returned HTTP ' + res.status);
    }

    const files = await res.json();

    const names = files
      .filter(file =>
        file.type === 'file' &&
        exts.some(ext => file.name.toLowerCase().endsWith(ext))
      )
      .map(file => file.name);

    names.sort((a, b) =>
      a.localeCompare(b, undefined, {
        numeric: true,
        sensitivity: 'base'
      })
    );

    console.log('%cimages/ files found:', 'color:#4caf50', names);
    return names;

  } catch (err) {
    console.warn('Could not retrieve images from GitHub automatically — falling back to placeholders.', err);
    return [];
  }
}

const IMAGE_FILES = await discoverImages();
const IMAGE_COUNT = IMAGE_FILES.length;
const IMAGE_PATH = i => `images/${IMAGE_FILES[(i - 1) % IMAGE_COUNT]}`;
const stripExt = name => name.replace(/\.[^.]+$/, '');
const TITLE_FOR = i => IMAGE_COUNT ? stripExt(IMAGE_FILES[(i - 1) % IMAGE_COUNT]) : 'Untitled';

const WALL_H = 4;
const WALL_T = 0.3;
const EYE_H = 1.65;
const PLAYER_R = 0.35;

/* ---------------------------------------------------------------------
   SCENE / RENDERER / CAMERA
--------------------------------------------------------------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0a09);
scene.fog = new THREE.Fog(0x0b0a09, 20, 62);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, EYE_H, 3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ---------------------------------------------------------------------
   LIGHTING
--------------------------------------------------------------------- */
scene.add(new THREE.HemisphereLight(0x9fa8b8, 0x2a2420, 0.55));

const sun = new THREE.DirectionalLight(0xfff3e0, 0.5);
sun.position.set(6, 10, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -22; sun.shadow.camera.right = 22;
sun.shadow.camera.top = 22; sun.shadow.camera.bottom = -22;
sun.shadow.camera.far = 60;
scene.add(sun);

/* ---------------------------------------------------------------------
   MATERIALS
--------------------------------------------------------------------- */
const floorMat = new THREE.MeshStandardMaterial({ color: 0x4a3a2c, roughness: 0.85, metalness: 0.05 });
const ceilMat  = new THREE.MeshStandardMaterial({ color: 0xece6da, roughness: 0.95 });
const wallMat  = new THREE.MeshStandardMaterial({ color: 0xdcd3c2, roughness: 0.9 });
const frameMat = new THREE.MeshStandardMaterial({ color: 0x1c140c, roughness: 0.5, metalness: 0.3 });

/* ---------------------------------------------------------------------
   ROOMS — floors / ceilings (axis-aligned rectangles)
--------------------------------------------------------------------- */
const rooms = [
  { x: [-6, 6],   z: [-5, 5]   }, // Entrance Hall
  { x: [-6, 6],   z: [-11, -5] }, // North Gallery
  { x: [6, 14],   z: [-5, 5]   }, // East Gallery
  { x: [-14, -6], z: [-5, 5]   }, // West Gallery
  { x: [-6, 6],   z: [5, 11]   }, // South Gallery
  { x: [6, 14],   z: [-11, -5] }, // North-East Room
  { x: [-14, -6], z: [-11, -5] }, // North-West Room
  { x: [6, 14],   z: [5, 11]   }, // South-East Room
  { x: [-14, -6], z: [5, 11]   }, // South-West Room
  { x: [-6, 6],   z: [-17, -11] }, // Far North          (new)
  { x: [6, 14],   z: [-17, -11] }, // Far North-East     (new)
  { x: [-14, -6], z: [-17, -11] }, // Far North-West     (new)
  { x: [-6, 6],   z: [11, 17]  }, // Far South           (new)
  { x: [6, 14],   z: [11, 17]  }, // Far South-East      (new)
  { x: [-14, -6], z: [11, 17]  }, // Far South-West      (new)
];

for (const r of rooms) {
  const w = r.x[1] - r.x[0], d = r.z[1] - r.z[0];
  const cx = (r.x[0] + r.x[1]) / 2, cz = (r.z[0] + r.z[1]) / 2;

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(w, d), floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(cx, 0, cz);
  floor.receiveShadow = true;
  scene.add(floor);

  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(w, d), ceilMat);
  ceil.rotation.x = Math.PI / 2;
  ceil.position.set(cx, WALL_H, cz);
  scene.add(ceil);

  // soft ceiling lamp per room (replaces the old per-painting spotlights)
  const lamp = new THREE.PointLight(0xfff1d8, 28, 18, 2);
  lamp.position.set(cx, WALL_H - 0.5, cz);
  scene.add(lamp);
}

/* ---------------------------------------------------------------------
   WALLS — each entry: fixed axis + coordinate, running range, optional gap
--------------------------------------------------------------------- */
const wallDefs = [
  // outer shell, split at every room boundary
  { axis: 'z', at: 17,  range: [-14, -6] }, { axis: 'z', at: 17,  range: [-6, 6] }, { axis: 'z', at: 17,  range: [6, 14] },
  { axis: 'z', at: -17, range: [-14, -6] }, { axis: 'z', at: -17, range: [-6, 6] }, { axis: 'z', at: -17, range: [6, 14] },
  { axis: 'x', at: -14, range: [-17, -11] }, { axis: 'x', at: -14, range: [-11, -5] }, { axis: 'x', at: -14, range: [-5, 5] },
  { axis: 'x', at: -14, range: [5, 11] },    { axis: 'x', at: -14, range: [11, 17] },
  { axis: 'x', at: 14,  range: [-17, -11] }, { axis: 'x', at: 14,  range: [-11, -5] }, { axis: 'x', at: 14,  range: [-5, 5] },
  { axis: 'x', at: 14,  range: [5, 11] },    { axis: 'x', at: 14,  range: [11, 17] },

  // partitions running north-south (x = -6 and x = 6)
  { axis: 'x', at: -6, range: [-17, -11] },
  { axis: 'x', at: -6, range: [-11, -5] },
  { axis: 'x', at: -6, range: [-5, 5],  gap: [-1.5, 1.5] }, // Hall <-> West Gallery
  { axis: 'x', at: -6, range: [5, 11] },
  { axis: 'x', at: -6, range: [11, 17] },
  { axis: 'x', at: 6,  range: [-17, -11] },
  { axis: 'x', at: 6,  range: [-11, -5] },
  { axis: 'x', at: 6,  range: [-5, 5],  gap: [-1.5, 1.5] }, // Hall <-> East Gallery
  { axis: 'x', at: 6,  range: [5, 11] },
  { axis: 'x', at: 6,  range: [11, 17] },

  // partitions running east-west (z = -11, -5, 5, 11)
  { axis: 'z', at: -11, range: [-14, -6], gap: [-11.2, -8.8] }, // North-West <-> Far North-West
  { axis: 'z', at: -11, range: [-6, 6],   gap: [-1.5, 1.5] },   // North Gallery <-> Far North
  { axis: 'z', at: -11, range: [6, 14],   gap: [8.8, 11.2] },   // North-East <-> Far North-East
  { axis: 'z', at: -5, range: [-14, -6], gap: [-11.2, -8.8] },  // West Gallery <-> North-West
  { axis: 'z', at: -5, range: [-6, 6],   gap: [-1.5, 1.5] },    // Hall <-> North Gallery
  { axis: 'z', at: -5, range: [6, 14],   gap: [8.8, 11.2] },    // East Gallery <-> North-East
  { axis: 'z', at: 5,  range: [-14, -6], gap: [-11.2, -8.8] },  // West Gallery <-> South-West
  { axis: 'z', at: 5,  range: [-6, 6],   gap: [-1.5, 1.5] },    // Hall <-> South Gallery
  { axis: 'z', at: 5,  range: [6, 14],   gap: [8.8, 11.2] },    // East Gallery <-> South-East
  { axis: 'z', at: 11, range: [-14, -6], gap: [-11.2, -8.8] },  // South-West <-> Far South-West
  { axis: 'z', at: 11, range: [-6, 6],   gap: [-1.5, 1.5] },    // South Gallery <-> Far South
  { axis: 'z', at: 11, range: [6, 14],   gap: [8.8, 11.2] },    // South-East <-> Far South-East
];

const collisionSegments = []; // {x1,z1,x2,z2}
const wallSegments = [];      // solid wall pieces {axis,at,a,b}, used to hang paintings

function buildWallSegment(axis, at, a, b) {
  const len = b - a;
  if (len <= 0.05) return;
  wallSegments.push({ axis, at, a, b });
  let w, d, cx, cz;
  if (axis === 'z') { // runs along x, thin in z
    w = len; d = WALL_T; cx = (a + b) / 2; cz = at;
    collisionSegments.push({ x1: a, z1: at, x2: b, z2: at });
  } else { // axis === 'x', runs along z, thin in x
    w = WALL_T; d = len; cx = at; cz = (a + b) / 2;
    collisionSegments.push({ x1: at, z1: a, x2: at, z2: b });
  }
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, d), wallMat);
  mesh.position.set(cx, WALL_H / 2, cz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

for (const wdef of wallDefs) {
  const [a, b] = wdef.range;
  if (wdef.gap) {
    buildWallSegment(wdef.axis, wdef.at, a, wdef.gap[0]);
    buildWallSegment(wdef.axis, wdef.at, wdef.gap[1], b);
  } else {
    buildWallSegment(wdef.axis, wdef.at, a, b);
  }
}

/* ---------------------------------------------------------------------
   LOAD IMAGES FIRST — every frame is sized to its own picture's aspect
   ratio, so each image's natural dimensions are needed before the walls
   are laid out.
--------------------------------------------------------------------- */
const textureLoader = new THREE.TextureLoader();

const loadImage = i => new Promise(resolve => textureLoader.load(
  IMAGE_PATH(i),
  tex => {
    tex.colorSpace = THREE.SRGBColorSpace;
    console.log('%cLoaded', 'color:#4caf50', IMAGE_PATH(i));
    resolve({ index: i, tex, aspect: tex.image.width / tex.image.height });
  },
  undefined,
  err => { console.warn('Failed to load', IMAGE_PATH(i), err); resolve(null); }
));

let images = (await Promise.all(
  Array.from({ length: IMAGE_COUNT }, (_, k) => loadImage(k + 1))
)).filter(Boolean);

// No images available -> placeholders in a mix of shapes so the layout still works
if (!images.length) {
  images = [16 / 9, 16 / 9, 9 / 16, 4 / 3, 3 / 4, 1].map((aspect, k) => ({ index: k + 1, tex: null, aspect }));
}

/* ---------------------------------------------------------------------
   PAINTINGS — hung automatically on every interior wall face, in image
   order. Each frame takes the exact aspect ratio of its image (landscape,
   portrait, square, ultra-wide... anything), so nothing is cropped or
   stretched. Images are cycled if there are more frames than images.
--------------------------------------------------------------------- */
const ART_Y = 2.0, FRAME_PAD = 0.14, EDGE = 0.65, MIN_GAP = 0.8;
const BASE_H = [1.5, 1.9];     // landscape picture heights alternate for visual rhythm
const PORTRAIT_BOOST = 1.25;   // portrait pictures are hung a little taller
const MAX_ART_W = 3.6;         // widest picture area (very wide panoramas get scaled down)
const MAX_ART_H = 2.5;         // tallest picture area (walls are 4 m high, centred on ART_Y)
const MIN_SCALE = 0.7;         // how far a picture may shrink to squeeze onto a short wall
const insideAnyRoom = (x, z) => rooms.some(r => x > r.x[0] && x < r.x[1] && z > r.z[0] && z < r.z[1]);

function frameSize(aspect, baseH) {
  const h0 = aspect >= 1 ? baseH : baseH * PORTRAIT_BOOST;
  const w0 = h0 * aspect;
  const s = Math.min(1, MAX_ART_W / w0, MAX_ART_H / h0);
  return { w: w0 * s, h: h0 * s };
}

const paintingDefs = [];
let imgCursor = 0, placed = 0;
for (const seg of wallSegments) {
  const len = seg.b - seg.a, mid = (seg.a + seg.b) / 2;
  for (const n of [1, -1]) { // both faces of the wall
    const px = seg.axis === 'z' ? mid : seg.at + n * 0.6;
    const pz = seg.axis === 'z' ? seg.at + n * 0.6 : mid;
    if (!insideAnyRoom(px, pz)) continue; // exterior face, nobody sees it

    // take images in order until the wall is full
    const row = [];
    let used = 0;
    const avail = len - 2 * EDGE;
    for (;;) {
      const img = images[imgCursor % images.length];
      let { w, h } = frameSize(img.aspect, BASE_H[placed % BASE_H.length]);
      const gapNeed = row.length ? MIN_GAP : 0;
      const room = avail - used - gapNeed - FRAME_PAD;
      if (w > room) {                     // too wide: shrink to fit, or stop
        const s = room / w;
        // a wall with nothing on it yet must still get something, even if
        // that means shrinking well past MIN_SCALE — only a wall that
        // already has a picture is allowed to stop here instead.
        const floor = row.length ? MIN_SCALE : 0.3;
        if (s < floor) break;
        w *= s; h *= s;
      }
      row.push({ img, w, h });
      used += w + FRAME_PAD + gapNeed;
      imgCursor++; placed++;
    }

    const total = row.reduce((sum, f) => sum + f.w + FRAME_PAD, 0);
    const gap = (len - total) / (row.length + 1);
    let t = seg.a + gap;
    for (const f of row) {
      const outer = f.w + FRAME_PAD;
      const c = t + outer / 2;
      t += outer + gap;
      paintingDefs.push(seg.axis === 'z'
        ? { x: c, y: ART_Y, z: seg.at + n * 0.2, nx: 0, nz: n, w: f.w, h: f.h, img: f.img }
        : { x: seg.at + n * 0.2, y: ART_Y, z: c, nx: n, nz: 0, w: f.w, h: f.h, img: f.img });
    }
  }
}
// __END_LAYOUT__

const placeholderCache = {};

function placeholderTexture(index, aspect) {
  if (placeholderCache[index]) return placeholderCache[index];
  const c = document.createElement('canvas');
  const BIG = 1024;
  c.width  = aspect >= 1 ? BIG : Math.round(BIG * aspect);
  c.height = aspect >= 1 ? Math.round(BIG / aspect) : BIG;
  const ctx = c.getContext('2d');
  const hue = (index * 47) % 360;
  ctx.fillStyle = `hsl(${hue},35%,72%)`;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.fillStyle = `hsl(${hue},30%,45%)`;
  ctx.beginPath();
  ctx.ellipse(c.width * 0.5, c.height * 0.42, c.width * 0.2, c.height * 0.3, 0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(20,16,12,0.85)';
  ctx.fillRect(0, c.height - 56, c.width, 56);
  ctx.fillStyle = '#f0e9db';
  ctx.font = '28px Georgia';
  ctx.textAlign = 'center';
  ctx.fillText(TITLE_FOR(index), c.width / 2, c.height - 18);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  placeholderCache[index] = tex;
  return tex;
}

const paintingMeshes = []; // raycast targets, each has userData {title, w, h, land, normal}

paintingDefs.forEach((p) => {
  const yaw = Math.atan2(p.nx, p.nz); // rotates default +z-facing plane to (nx,0,nz)

  const group = new THREE.Group();
  group.position.set(p.x, p.y, p.z);
  group.rotation.y = yaw;

  const frame = new THREE.Mesh(
    new THREE.BoxGeometry(p.w + FRAME_PAD, p.h + FRAME_PAD, 0.06),
    frameMat
  );
  frame.position.z = -0.02;
  frame.castShadow = true;
  group.add(frame);

  // the plane has the image's own ratio, so the full image is shown uncropped
  const map = p.img.tex || placeholderTexture(p.img.index, p.img.aspect);
  const artMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, map });
  const art = new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.h), artMat);
  art.position.z = 0.02;
  art.userData.isPainting = true;
  group.add(art);
  scene.add(group);

  paintingMeshes.push(art);
  art.userData.title = TITLE_FOR(p.img.index);
  art.userData.land = p.w >= p.h;
  art.userData.w = p.w;
  art.userData.h = p.h;
  art.userData.normal = new THREE.Vector3(p.nx, 0, p.nz);
  art.userData.worldPos = new THREE.Vector3(p.x, p.y, p.z);
});

/* ---------------------------------------------------------------------
   CONTROLS / MOVEMENT
--------------------------------------------------------------------- */
const controls = new PointerLockControls(camera, renderer.domElement);
scene.add(controls.getObject());

const overlay = document.getElementById('overlay');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');
const caption = document.getElementById('caption');

loading.style.display = 'none';
overlay.classList.remove('hidden');

const IS_TOUCH = window.matchMedia('(pointer: coarse)').matches;
let touchActive = false;
const isActive = () => IS_TOUCH ? touchActive : controls.isLocked;
if (IS_TOUCH) document.body.classList.add('touch');

overlay.addEventListener('click', () => {
  if (zoomed) return;
  if (IS_TOUCH) {
    touchActive = true;
    document.body.classList.add('playing');
    overlay.classList.add('hidden');
    const el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); } catch (e) {}
  } else {
    controls.lock();
  }
});
controls.addEventListener('lock', () => { overlay.classList.add('hidden'); });
controls.addEventListener('unlock', () => {
  if (!zoomed) overlay.classList.remove('hidden');
});

/* ---- touch: virtual joystick + drag-to-look + tap-to-view ---- */
const joy = { x: 0, y: 0 };            // x: strafe, y: forward (-1..1)
const joyEl = document.getElementById('joystick');
const knobEl = joyEl.querySelector('.knob');
let joyId = null;
const JOY_R = 48;

function joyUpdate(e) {
  const r = joyEl.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2);
  let dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy);
  if (d > JOY_R) { dx = dx / d * JOY_R; dy = dy / d * JOY_R; }
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
  joy.x = dx / JOY_R;
  joy.y = -dy / JOY_R;
}
function joyReset() {
  joyId = null; joy.x = joy.y = 0;
  knobEl.style.transform = 'translate(0,0)';
}
joyEl.addEventListener('pointerdown', (e) => {
  if (joyId !== null) return;
  joyId = e.pointerId;
  joyEl.setPointerCapture(e.pointerId);
  joyUpdate(e);
  e.preventDefault();
});
joyEl.addEventListener('pointermove', (e) => { if (e.pointerId === joyId) joyUpdate(e); });
['pointerup', 'pointercancel'].forEach(t => joyEl.addEventListener(t, (e) => { if (e.pointerId === joyId) joyReset(); }));

const LOOK_SENS = 0.0048;
const lookEuler = new THREE.Euler(0, 0, 0, 'YXZ');
let lookId = null, lookLX = 0, lookLY = 0, lookStartX = 0, lookStartY = 0, lookStartT = 0, lookMoved = false;
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => {
  if (!IS_TOUCH || !touchActive || lookId !== null) return;
  lookId = e.pointerId;
  cv.setPointerCapture(e.pointerId);
  lookLX = lookStartX = e.clientX; lookLY = lookStartY = e.clientY;
  lookStartT = performance.now(); lookMoved = false;
});
cv.addEventListener('pointermove', (e) => {
  if (e.pointerId !== lookId) return;
  if (Math.hypot(e.clientX - lookStartX, e.clientY - lookStartY) > 10) lookMoved = true;
  if (zoomed || animT < 1) { lookLX = e.clientX; lookLY = e.clientY; return; }
  if (lookMoved) {
    lookEuler.setFromQuaternion(camera.quaternion);
    lookEuler.y -= (e.clientX - lookLX) * LOOK_SENS;
    lookEuler.x -= (e.clientY - lookLY) * LOOK_SENS;
    lookEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, lookEuler.x));
    camera.quaternion.setFromEuler(lookEuler);
  }
  lookLX = e.clientX; lookLY = e.clientY;
});
const lookEnd = (e) => {
  if (e.pointerId !== lookId) return;
  lookId = null;
  if (e.type === 'pointerup' && !lookMoved && performance.now() - lookStartT < 500) onTap(e.clientX, e.clientY);
};
cv.addEventListener('pointerup', lookEnd);
cv.addEventListener('pointercancel', lookEnd);

function onTap(x, y) {
  if (animT < 1) return;
  if (zoomed) { endZoom(); return; }
  pointer.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(paintingMeshes, false);
  if (hits.length) startZoom(hits[0].object);
}

const keys = {};
document.addEventListener('keydown', (e) => { keys[e.code] = true; });
document.addEventListener('keyup', (e) => { keys[e.code] = false; });

const velocity = new THREE.Vector3();
const MOVE_SPEED = 4.2;

function resolveCollision(pos) {
  for (const seg of collisionSegments) {
    const sx = seg.x2 - seg.x1, sz = seg.z2 - seg.z1;
    const len2 = sx * sx + sz * sz || 1;
    let t = ((pos.x - seg.x1) * sx + (pos.z - seg.z1) * sz) / len2;
    t = Math.max(0, Math.min(1, t));
    const cx = seg.x1 + sx * t, cz = seg.z1 + sz * t;
    const dx = pos.x - cx, dz = pos.z - cz;
    const dist = Math.hypot(dx, dz);
    const minDist = PLAYER_R + WALL_T / 2;
    if (dist < minDist && dist > 0.0001) {
      const push = (minDist - dist);
      pos.x += (dx / dist) * push;
      pos.z += (dz / dist) * push;
    }
  }
  return pos;
}

/* ---------------------------------------------------------------------
   PAINTING ZOOM INTERACTION
--------------------------------------------------------------------- */
const raycaster = new THREE.Raycaster();
raycaster.far = 4.2;
const screenCenter = new THREE.Vector2(0, 0);
const pointer = new THREE.Vector2();

let zoomed = false;
let zoomTarget = null;
const camReturnPos = new THREE.Vector3();
const camReturnQuat = new THREE.Quaternion();
const camStart = new THREE.Vector3();
const camEnd = new THREE.Vector3();
const quatStart = new THREE.Quaternion();
const quatEnd = new THREE.Quaternion();
let animT = 1; // 1 = animation finished
const ANIM_TIME = 0.7;
let animClock = 0;

function tryFocusHovered() {
  raycaster.setFromCamera(screenCenter, camera);
  const hits = raycaster.intersectObjects(paintingMeshes, false);
  if (hits.length) startZoom(hits[0].object);
}

function startZoom(art) {
  zoomed = true;
  document.body.classList.add('zoomed');
  zoomTarget = art;
  controls.unlock ? null : null; // keep pointer lock active for smoothness

  camReturnPos.copy(camera.position);
  camReturnQuat.copy(camera.quaternion);

  const normal = art.userData.normal;
  const wp = new THREE.Vector3();
  art.getWorldPosition(wp);
  const tanHalf = Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
  const fit = Math.max((art.userData.h / 2) / tanHalf, (art.userData.w / 2) / (tanHalf * camera.aspect));
  const dist = Math.min(3.0, Math.max(0.9, fit * 1.1));
  camStart.copy(camera.position);
  camEnd.copy(wp).addScaledVector(normal, dist);
  camEnd.y = Math.max(1.2, Math.min(2.6, wp.y));

  quatStart.copy(camera.quaternion);
  const lookMat = new THREE.Matrix4().lookAt(camEnd, wp, new THREE.Vector3(0, 1, 0));
  quatEnd.setFromRotationMatrix(lookMat);

  animT = 0; animClock = 0;

  caption.querySelector('.t').textContent = art.userData.title;
}

function endZoom() {
  camStart.copy(camera.position);
  camEnd.copy(camReturnPos);
  quatStart.copy(camera.quaternion);
  quatEnd.copy(camReturnQuat);
  animT = 0; animClock = 0;
  zoomed = false;
  document.body.classList.remove('zoomed');
  caption.classList.remove('show');
  zoomTargetPending = null;
}
let zoomTargetPending = null;

renderer.domElement.addEventListener('click', () => {
  if (IS_TOUCH || !controls.isLocked) return;
  if (zoomed) {
    endZoom();
  } else {
    tryFocusHovered();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Escape' && zoomed) endZoom();
});

/* ---------------------------------------------------------------------
   MAIN LOOP
--------------------------------------------------------------------- */
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // hover hint (only when not zoomed & locked)
  if (isActive() && !zoomed) {
    raycaster.setFromCamera(screenCenter, camera);
    const hits = raycaster.intersectObjects(paintingMeshes, false);
    hint.classList.toggle('show', hits.length > 0);
  } else {
    hint.classList.remove('show');
  }

  if (animT < 1) {
    animClock += dt;
    animT = Math.min(1, animClock / ANIM_TIME);
    const e = 1 - Math.pow(1 - animT, 3); // ease-out cubic
    camera.position.lerpVectors(camStart, camEnd, e);
    camera.quaternion.slerpQuaternions(quatStart, quatEnd, e);
    if (animT >= 1 && zoomed) caption.classList.add('show');
  } else if (isActive() && !zoomed) {
    // walking
    let forward = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
    let strafe = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);

    velocity.set(strafe, 0, forward);
    if (velocity.lengthSq() > 0) velocity.normalize().multiplyScalar(MOVE_SPEED * dt);
    if (joy.x || joy.y) {
      // analog speed from joystick deflection
      const mag = Math.min(1, Math.hypot(joy.x, joy.y));
      velocity.set(joy.x, 0, joy.y).normalize().multiplyScalar(MOVE_SPEED * mag * dt);
    }

    controls.moveRight(velocity.x);
    controls.moveForward(velocity.z);

    const obj = controls.getObject();
    const pos2 = new THREE.Vector3(obj.position.x, 0, obj.position.z);
    resolveCollision(pos2);
    obj.position.x = pos2.x;
    obj.position.z = pos2.z;
    obj.position.y = EYE_H;
  }

  renderer.render(scene, camera);
}
animate();
</script>
